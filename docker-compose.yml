version: "3.3"

services:
  vmotors-api:
    container_name: vmotors-api
    restart: always
    image: node:20.10.0
    ports:
      - 4001:3007
    volumes:
      - ./:/usr/src/vmotors
    working_dir: /usr/src/vmotors

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod"

  vmotors-batch:
    container_name: vmotors-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    volumes:
      - ./:/usr/src/vmotors
    working_dir: /usr/src/vmotors

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod:batch"


networks:
  monorepo-network:
    driver: bridge





# vmotors-next:  localhost:4000 <=> container:3000
# vmotors-api:   localhost:4001 <=> container:3007
# vmotors-batch: localhost:4002 <=> container:3008